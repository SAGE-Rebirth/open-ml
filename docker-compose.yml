# ============================================================================
# OpenML — a personal, self-hosted ML platform (SageMaker/Vertex-at-home)
#
# Services are grouped by Compose PROFILES. The control-dashboard turns each
# stack on/off. "core" services carry no profile, so they always start with
# `docker compose up -d`. Everything else is started on demand by naming the
# service explicitly (e.g. `docker compose up -d jupyter`) and stopped with
# `docker compose stop jupyter`.
#
#   PHASE 0 (this file): core + develop
#   Later phases append: track, monitor, label, pipeline, cicd, serve, vision
# ============================================================================

networks:
  openml_net:
    name: openml_net
    driver: bridge

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:
  aimrepo:
  labelstudio:
  zenml:
  gitea:
  giteashared:
  actrunner:
  vault:

# --- reusable label anchors -------------------------------------------------
x-openml-labels: &default-labels
  openml.managed: "true"

services:

  # ==========================================================================
  # CORE  (always on — no profile)
  # ==========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: openml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openml}
      POSTGRES_DB: ${POSTGRES_DB:-openml}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openml} -d ${POSTGRES_DB:-openml}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      <<: *default-labels
      openml.stack: "core"
      openml.service: "postgres"

  minio:
    image: minio/minio:latest
    container_name: openml-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      <<: *default-labels
      openml.stack: "core"
      openml.service: "minio"

  # one-shot: create buckets, then exit
  minio-init:
    image: minio/mc:latest
    container_name: openml-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      for b in $${MINIO_BUCKETS}; do mc mb -p local/$$b || true; done &&
      echo 'OpenML: MinIO buckets ready:' $${MINIO_BUCKETS} &&
      exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKETS: ${MINIO_BUCKETS:-mlflow datasets models}
    networks: [openml_net]
    restart: "no"
    labels:
      <<: *default-labels
      openml.stack: "core"
      openml.service: "minio-init"

  # one-shot: create per-service databases (idempotent), then exit
  db-init:
    image: postgres:16-alpine
    container_name: openml-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-openml}
      PGPASSWORD: ${POSTGRES_PASSWORD:-openml}
    entrypoint: >
      /bin/sh -c "
      for db in mlflow labelstudio zenml gitea; do
        psql -tc \"SELECT 1 FROM pg_database WHERE datname='$$db'\" | grep -q 1 ||
        psql -c \"CREATE DATABASE \\\"$$db\\\"\";
      done;
      echo 'OpenML: databases ready'; exit 0"
    networks: [openml_net]
    restart: "no"
    labels:
      <<: *default-labels
      openml.stack: "core"
      openml.service: "db-init"

  redis:
    image: redis:7-alpine
    container_name: openml-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    networks: [openml_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      <<: *default-labels
      openml.stack: "core"
      openml.service: "redis"

  control-dashboard:
    build:
      context: ./control-dashboard
    image: openml/control-dashboard:latest
    container_name: openml-dashboard
    restart: unless-stopped
    environment:
      OPENML_PROJECT_DIR: ${OPENML_PROJECT_DIR:-/project}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-openml}
      OPENML_VM_MEM_GB: ${OPENML_VM_MEM_GB:-12}
      # vault storage (envelope-encrypted secrets live in Postgres; DEK only in RAM)
      OPENML_PG_DSN: postgresql://${POSTGRES_USER:-openml}:${POSTGRES_PASSWORD:-openml}@postgres:5432/${POSTGRES_DB:-openml}
      # port map passed through so the UI can build clickable links
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}
      JUPYTER_PORT: ${JUPYTER_PORT:-8888}
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT:-9001}
      MINIO_API_PORT: ${MINIO_API_PORT:-9000}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MLFLOW_PORT: ${MLFLOW_PORT:-5000}
      AIM_PORT: ${AIM_PORT:-43800}
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
      CADVISOR_PORT: ${CADVISOR_PORT:-8082}
      PUSHGATEWAY_PORT: ${PUSHGATEWAY_PORT:-9091}
      LABELSTUDIO_PORT: ${LABELSTUDIO_PORT:-8081}
      ZENML_PORT: ${ZENML_PORT:-8237}
      GITEA_PORT: ${GITEA_PORT:-3001}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      # docker socket -> control the daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # mount the project at the SAME absolute path so `docker compose` run
      # from inside resolves ./bind mounts and build contexts identically
      - ${OPENML_PROJECT_DIR:-.}:${OPENML_PROJECT_DIR:-/project}
      # vault auto-unseal key file (only written if you enable auto-unseal)
      - vault:/vault
    # NOTE: no `working_dir` here — the app must run from its image WORKDIR
    # (/srv) so `uvicorn app.main:app` resolves. Compose commands the dashboard
    # issues set cwd=$OPENML_PROJECT_DIR explicitly (see app/docker_ctl.py).
    networks: [openml_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      <<: *default-labels
      openml.stack: "core"
      openml.service: "control-dashboard"

  # ==========================================================================
  # DEVELOP  (profile: develop)  — SageMaker Studio / Vertex Workbench
  # ==========================================================================

  jupyter:
    build:
      context: ./jupyter
    image: openml/jupyter:latest
    container_name: openml-jupyter
    profiles: ["develop"]
    restart: unless-stopped
    # Cap the notebook container so a runaway job kills only its own kernel
    # instead of OOMing the whole VM and taking down core services.
    # Heavy / GPU training should run natively on the host (see docs).
    mem_limit: ${JUPYTER_MEM_LIMIT:-4g}
    mem_reservation: 512m
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-openml}
      # S3 / MinIO credentials so boto3, s3fs, dvc, mlflow "just work"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_ENDPOINT_URL: http://minio:9000
      # convenient connection strings for notebooks
      OPENML_S3_ENDPOINT: http://minio:9000
      OPENML_PG_DSN: postgresql://${POSTGRES_USER:-openml}:${POSTGRES_PASSWORD:-openml}@postgres:5432/${POSTGRES_DB:-openml}
      OPENML_REDIS_URL: redis://redis:6379/0
      # telemetry (Phase 1) — these resolve once the track/monitor stacks are up
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OPENML_PUSHGATEWAY_URL: http://pushgateway:9091
      OPENML_AIM_REPO: aim://aim:53800
      # ZenML client -> server (Phase 3). Only used when you run zenml/pipelines;
      # the Pipelines stack must be on. Server uses NO_AUTH (localhost only).
      ZENML_STORE_URL: http://zenml:8080
    ports:
      - "${BIND_HOST:-127.0.0.1}:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ./notebooks:/home/jovyan/work/notebooks
      - ./workspace:/home/jovyan/work/workspace
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/api || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      <<: *default-labels
      openml.stack: "develop"
      openml.service: "jupyter"

  # ==========================================================================
  # LABEL  (profile: label)  — SageMaker Ground Truth / Vertex Data Labeling
  # ==========================================================================

  label-studio:
    image: heartexlabs/label-studio:1.13.1
    container_name: openml-label-studio
    profiles: ["label"]
    restart: unless-stopped
    mem_limit: ${LABELSTUDIO_MEM_LIMIT:-2g}
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      # --- Postgres backend (db 'labelstudio' created by db-init) ---
      DJANGO_DB: default
      POSTGRE_NAME: labelstudio
      POSTGRE_USER: ${POSTGRES_USER:-openml}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD:-openml}
      POSTGRE_HOST: postgres
      POSTGRE_PORT: "5432"
      # --- data + local-files serving (shared with Jupyter via ./workspace) ---
      LABEL_STUDIO_BASE_DATA_DIR: /label-studio/data
      LOCAL_FILES_SERVING_ENABLED: "true"
      LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
      # --- browser-facing host so generated links resolve ---
      LABEL_STUDIO_HOST: http://localhost:${LABELSTUDIO_PORT:-8081}
      # --- auto-create an admin on first boot (reproducible) ---
      LABEL_STUDIO_USERNAME: ${LABELSTUDIO_USERNAME:-admin@openml.local}
      LABEL_STUDIO_PASSWORD: ${LABELSTUDIO_PASSWORD:-openml-admin}
      # don't phone home
      COLLECT_ANALYTICS: "false"
      # S3/MinIO creds available for users who prefer cloud source/target storage
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${LABELSTUDIO_PORT:-8081}:8080"
    volumes:
      - labelstudio:/label-studio/data
      - ./workspace:/label-studio/files
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 120s     # first boot runs DB migrations
    labels:
      <<: *default-labels
      openml.stack: "label"
      openml.service: "label-studio"

  # ==========================================================================
  # CICD  (profile: cicd)  — SageMaker Projects / Vertex CI  (Gitea + Actions)
  # ==========================================================================

  gitea:
    image: gitea/gitea:1.22
    container_name: openml-gitea
    profiles: ["cicd"]
    restart: unless-stopped
    mem_limit: ${GITEA_MEM_LIMIT:-1g}
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: ${POSTGRES_USER:-openml}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:-openml}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__ROOT_URL: http://localhost:${GITEA_PORT:-3001}/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GITEA_PORT:-3001}:3000"
    volumes:
      - gitea:/data
      - giteashared:/shared
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/healthz || wget -q -O /dev/null http://localhost:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    labels:
      <<: *default-labels
      openml.stack: "cicd"
      openml.service: "gitea"

  # one-shot: ensure an admin exists + write a runner registration token.
  # `generate-runner-token` hits gitea's INTERNAL server API, which only exists
  # inside the running gitea container — so we `docker exec` into it rather than
  # run a standalone gitea CLI (which would fail with a connection error).
  gitea-init:
    image: docker:27-cli
    container_name: openml-gitea-init
    profiles: ["cicd"]
    restart: "no"
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-openml}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-openml-admin}
    entrypoint:
      - /bin/sh
      - -c
      - >
        GTA="gitea --work-path /data --config /data/gitea/conf/app.ini";
        docker exec -u git openml-gitea $$GTA admin user create --admin
        --username "$${GITEA_ADMIN_USER}" --password "$${GITEA_ADMIN_PASSWORD}"
        --email admin@openml.local --must-change-password=false 2>/dev/null || true;
        docker exec -u git openml-gitea $$GTA actions generate-runner-token 2>/dev/null
        | tr -d '\r\n' > /shared/runner_token;
        chmod 644 /shared/runner_token;
        echo "gitea-init: admin ready + runner token written ($$(wc -c </shared/runner_token) bytes)"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - giteashared:/shared
    labels:
      <<: *default-labels
      openml.stack: "cicd"
      openml.service: "gitea-init"

  # build-only helper: builds the job image act-runner uses for Actions jobs.
  # Runs `true` and exits (like the other init jobs) — its purpose is the image,
  # so the job image is built BY compose (not a standalone `docker build`).
  ci-runner:
    build:
      context: ./cicd/ci-runner
    image: openml/ci-runner:latest
    container_name: openml-ci-runner
    profiles: ["cicd"]
    restart: "no"
    command: ["true"]
    labels:
      <<: *default-labels
      openml.stack: "cicd"
      openml.service: "ci-runner"

  act-runner:
    image: gitea/act_runner:0.2.11
    container_name: openml-act-runner
    profiles: ["cicd"]
    restart: unless-stopped
    mem_limit: ${ACTRUNNER_MEM_LIMIT:-1g}
    depends_on:
      gitea-init:
        condition: service_completed_successfully
      ci-runner:
        condition: service_completed_successfully
    # Use the image's DEFAULT entrypoint — it registers (idempotently, via the
    # persisted /data/.runner) from these env vars, then runs the daemon.
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /shared/runner_token
      GITEA_RUNNER_NAME: openml-runner
      GITEA_RUNNER_LABELS: "openml:docker://openml/ci-runner:latest,ubuntu-latest:docker://openml/ci-runner:latest"
      CONFIG_FILE: /config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./cicd/runner-config.yaml:/config.yaml:ro
      - giteashared:/shared:ro
      - actrunner:/data
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "pgrep act_runner >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      <<: *default-labels
      openml.stack: "cicd"
      openml.service: "act-runner"

  # ==========================================================================
  # PIPELINE  (profile: pipeline)  — SageMaker Pipelines / Vertex Pipelines
  # ==========================================================================

  zenml:
    build:
      context: ./zenml
    image: openml/zenml-server:latest
    container_name: openml-zenml
    profiles: ["pipeline"]
    restart: unless-stopped
    mem_limit: ${ZENML_MEM_LIMIT:-1g}
    mem_reservation: 256m
    environment:
      # local personal server — no auth so the Jupyter client connects with just
      # the store URL (localhost-bound; do not expose this port).
      ZENML_SERVER_AUTH_SCHEME: NO_AUTH
      ZENML_ANALYTICS_OPT_IN: "false"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${ZENML_PORT:-8237}:8080"
    volumes:
      - zenml:/zenml/.zenconfig
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 20s
      timeout: 8s
      retries: 6
      start_period: 120s     # first boot runs Alembic migrations
    labels:
      <<: *default-labels
      openml.stack: "pipeline"
      openml.service: "zenml"

  # ==========================================================================
  # TRACK  (profile: track)  — SageMaker Experiments / Vertex Experiments
  # ==========================================================================

  mlflow:
    build:
      context: ./mlflow
    image: openml/mlflow:latest
    container_name: openml-mlflow
    profiles: ["track"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-openml}:${POSTGRES_PASSWORD:-openml}@postgres:5432/mlflow
      --default-artifact-root s3://mlflow/
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      <<: *default-labels
      openml.stack: "track"
      openml.service: "mlflow"

  aim:
    image: aimstack/aim:3.25.0
    container_name: openml-aim
    profiles: ["track"]
    restart: unless-stopped
    # run the remote tracking server (53800) + the web UI (43800) on one repo
    entrypoint: >
      /bin/sh -c "aim init --repo /aim 2>/dev/null || true;
      aim server --repo /aim --host 0.0.0.0 --port 53800 &
      exec aim up --repo /aim --host 0.0.0.0 --port 43800"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${AIM_PORT:-43800}:43800"
      - "${BIND_HOST:-127.0.0.1}:${AIM_SERVER_PORT:-53800}:53800"
    volumes:
      - aimrepo:/aim
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:43800/').status==200 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 5
    labels:
      <<: *default-labels
      openml.stack: "track"
      openml.service: "aim"

  # ==========================================================================
  # MONITOR  (profile: monitor)  — SageMaker Model Monitor / infra metrics
  # ==========================================================================

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: openml-prometheus
    profiles: ["monitor"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 4
    labels:
      <<: *default-labels
      openml.stack: "monitor"
      openml.service: "prometheus"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: openml-grafana
    profiles: ["monitor"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 4
    labels:
      <<: *default-labels
      openml.stack: "monitor"
      openml.service: "grafana"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: openml-cadvisor
    profiles: ["monitor"]
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      # explicit socket bind — Docker Desktop resolves THIS exact path to the
      # real daemon socket, so cAdvisor can resolve container name/image labels
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CADVISOR_PORT:-8082}:8080"
    networks: [openml_net]
    labels:
      <<: *default-labels
      openml.stack: "monitor"
      openml.service: "cadvisor"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: openml-node-exporter
    profiles: ["monitor"]
    restart: unless-stopped
    # Docker Desktop's VM rejects rslave propagation on `/`; mount /proc and
    # /sys read-only instead — enough for CPU/memory of the Docker VM (the
    # relevant "host" for these containers on macOS).
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    ports:
      - "${BIND_HOST:-127.0.0.1}:${NODE_EXPORTER_PORT:-9100}:9100"
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 4
    labels:
      <<: *default-labels
      openml.stack: "monitor"
      openml.service: "node-exporter"

  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: openml-pushgateway
    profiles: ["monitor"]
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PUSHGATEWAY_PORT:-9091}:9091"
    networks: [openml_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9091/-/healthy || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 4
    labels:
      <<: *default-labels
      openml.stack: "monitor"
      openml.service: "pushgateway"
