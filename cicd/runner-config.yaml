log:
  level: info
runner:
  capacity: 1
  timeout: 30m
  fetch_timeout: 5s
  fetch_interval: 2s
cache:
  enabled: false
container:
  # job containers join the OpenML network so they can reach
  # gitea / mlflow / minio by service name
  network: openml_net
  privileged: false
  # ci-runner is a LOCAL image (not in a registry) — never try to pull it
  force_pull: false
  # label the ephemeral job containers so they're identifiable as OpenML's
  # (they are created + destroyed per job by the runner — not compose services)
  # --memory/--cpus bound each job: a runaway training job OOM-kills only itself
  # instead of exhausting the VM and taking down core services (postgres/minio).
  options: "--memory=2g --cpus=2 --label openml.project=openml --label openml.stack=cicd-job"
